name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      flutter_version: '3.50.1'
      setup: dart run build_runner build --delete-conflicting-outputs
      coverage_excludes: "**/*.g.dart"
      min_coverage: 0
      timeout_minutes: 15

  build_apk:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build release APK
        shell: bash
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          build_args=(apk --release)
          if [ -n "$API_BASE_URL" ]; then
            build_args+=("--dart-define=API_BASE_URL=$API_BASE_URL")
          fi

          build_log="$RUNNER_TEMP/flutter-apk-build.log"
          for attempt in 1 2 3; do
            if flutter build "${build_args[@]}" 2>&1 | tee "$build_log"; then
              break
            else
              build_status=${PIPESTATUS[0]}
            fi

            if [ "$build_status" -eq 0 ]; then
              exit 1
            fi
            if [ "$attempt" -eq 3 ] || ! grep -Eq 'Received status code (429|500|502|503|504)|Gradle threw an error while downloading artifacts from the network' "$build_log"; then
              exit "$build_status"
            fi

            delay_seconds=$((attempt * 60))
            echo "::warning::Gradle dependency download failed. Retrying in ${delay_seconds}s (attempt ${attempt}/3)."
            sleep "$delay_seconds"
          done
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
